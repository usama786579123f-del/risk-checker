name: Refresh risk data

on:
  schedule:
    - cron: "23 6 * * *"   # every day, 06:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt pytest

      - name: Tests (offline, no network)
        run: python -m pytest -q

      - name: Fetch OFAC list and SEC filings
        env:
          # Repository secret holding YOUR email address (SEC asks automated clients to identify
          # themselves). No API key is needed anywhere. Settings > Secrets and variables > Actions.
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m pipeline.run

      # If the step above fails (no email secret, OFAC or SEC down, SEC blocking),
      # the job turns red and GitHub emails you. The old data stays online, marked stale.
      - name: Commit refreshed data
        run: |
          git config user.name "risk-checker-bot"
          git config user.email "risk-checker-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "chore: refresh risk data" && git push)
